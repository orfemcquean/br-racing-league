const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const findPlayer=reg=>{const h=DATA.history[String(reg)]||[]; const p=DATA.races.flatMap(r=>r.entries).find(e=>String(e.registration_number)===String(reg)); return p||{registration_number:reg,name:'選手'};};
function go(path){location.hash='#/'+path}function fmtDate(d){return d?d.replaceAll('-','/'):'—'}
function home(){return `<section class="hero"><div>RACE DATABASE PROTOTYPE</div><h1>レースカード試作</h1><p>現在のDBに登録されている出走表・結果を使い、レースと選手を双方向に紐付けた試作版です。</p></section><div class="grid"><div class="card"><div class="label">登録レース</div><div class="num">${DATA.races.length}</div></div><div class="card"><div class="label">出走表登録艇</div><div class="num">${DATA.races.reduce((n,r)=>n+r.entries.length,0)}</div></div><div class="card"><div class="label">結果ありレース</div><div class="num">${DATA.races.filter(r=>r.has_result).length}</div></div><div class="card"><div class="label">データ源</div><div class="num" style="font-size:14px">SQLite DB</div></div></div><section class="section"><div class="sectionhead"><h2>最新のレース</h2><a href="#/races">すべて見る</a></div>${raceTable(DATA.races.slice(0,12))}</section>`}
function raceTable(rows){return `<div class="tablewrap"><table class="table"><thead><tr><th>日付</th><th>開催</th><th>R</th><th>グレード</th><th>出走表</th><th>結果</th></tr></thead><tbody>${rows.map(r=>`<tr onclick="go('race/${r.id}')"><td>${fmtDate(r.date)}</td><td>${esc(r.event_name||'—')}</td><td><b>${r.race_number}R</b></td><td>${esc(r.grade||'—')}</td><td>${r.entries.length}艇</td><td>${r.has_result?'あり':'未報告'}</td></tr>`).join('')}</tbody></table></div>`}
function racesPage(){return `<section class="section"><div class="sectionhead"><h1>レース一覧</h1><span class="muted">出走表登録を基準に作成</span></div><input class="search" id="q" placeholder="開催名・日付・R・グレードで検索" oninput="filterRaces()"> <div id="raceRows">${raceTable(DATA.races)}</div></section>`}
function filterRaces(){const q=document.getElementById('q').value.toLowerCase(); const rows=DATA.races.filter(r=>`${r.date} ${r.event_name} ${r.race_number}r ${r.grade}`.toLowerCase().includes(q)); document.getElementById('raceRows').innerHTML=raceTable(rows)}
function racePage(id){const r=DATA.races.find(x=>x.id===id);if(!r)return '<p>レースがありません。</p>';const idx=DATA.races.findIndex(x=>x.id===id);const prev=DATA.races[idx+1],next=DATA.races[idx-1];const sorted=[...r.entries].filter(e=>e.finish!=null||e.status==='F').sort((a,b)=>(a.finish??99)-(b.finish??99));return `<a class="back" href="#/races">← レース一覧へ</a><div class="racehead"><div class="muted">${fmtDate(r.date)}　${esc(r.grade||'')}　${esc(r.event_name||'')}</div><h1>${r.race_number}R レースカード</h1><div class="race-meta"><span class="badge">節ID ${r.section_id}</span><span class="badge">${r.entries.length}艇</span><span class="badge ${r.has_result?'status-ok':'status-pending'}">${r.has_result?'結果あり':'結果未報告'}</span></div><div class="notice">号艇は出走表登録時点の lane を使用。選手名を押すと選手ページへ移動できます。</div></div><section class="section"><h2>出走表・結果</h2><div class="lanes">${r.entries.sort((a,b)=>(a.lane||99)-(b.lane||99)).map(e=>`<div class="lane"><div class="laneNo">${e.lane?e.lane+'号艇':'—'}</div><div class="laneBody"><div class="laneName">${e.registration_number?`<a class="entry-link" href="#/player/${encodeURIComponent(e.registration_number)}">${esc(e.name)}</a>`:`<span class="npc">${esc(e.name)}</span>`}</div><div class="reg">${e.registration_number?'登録番号 '+esc(e.registration_number):'NPC / 登録番号なし'}</div><div class="finish ${e.status==='F'?'flying':''}">${e.status==='F'?'F':e.finish?e.finish+'着':r.has_result?'—':'未確定'}</div><div class="muted">${e.points!=null?'得点 '+e.points+'点':''}</div></div></div>`).join('')}</div></section><section class="section"><h2>着順結果</h2>${r.has_result?raceTableResult(sorted):'<div class="notice">このレースはまだ結果が揃っていません。</div>'}</section><div class="race-nav">${next?`<a href="#/race/${next.id}">← 前のレース ${next.race_number}R</a>`:'<span></span>'}${prev?`<a href="#/race/${prev.id}">次のレース ${prev.race_number}R →</a>`:''}</div>`}
function raceTableResult(rows){return `<div class="tablewrap"><table class="table"><thead><tr><th>着</th><th>艇</th><th>登録番号</th><th>選手</th><th>得点</th></tr></thead><tbody>${rows.map(e=>`<tr><td class="result-win">${e.status==='F'?'F':e.finish+'着'}</td><td>${e.lane?e.lane+'号艇':'—'}</td><td>${e.registration_number||'—'}</td><td>${e.registration_number?`<a href="#/player/${encodeURIComponent(e.registration_number)}">${esc(e.name)}</a>`:esc(e.name)}</td><td>${e.points??'—'}</td></tr>`).join('')}</tbody></table></div>`}
function playersPage(){const seen=new Map();DATA.races.flatMap(r=>r.entries).forEach(e=>{if(e.registration_number&&!seen.has(e.registration_number))seen.set(e.registration_number,e)});const arr=[...seen.values()].sort((a,b)=>String(a.registration_number).localeCompare(String(b.registration_number)));return `<section class="section"><h1>選手一覧</h1><div class="tablewrap"><table class="table"><thead><tr><th>登録番号</th><th>選手</th><th>支部</th><th>級別</th><th>出走数</th></tr></thead><tbody>${arr.map(e=>`<tr onclick="go('player/${encodeURIComponent(e.registration_number)}')"><td>${e.registration_number}</td><td><a href="#/player/${encodeURIComponent(e.registration_number)}">${esc(e.name)}</a></td><td>${esc(e.branch||'—')}</td><td>${esc(e.grade||'—')}</td><td>${(DATA.history[e.registration_number]||[]).length}</td></tr>`).join('')}</tbody></table></div></section>`}
function playerPage(reg){const p=findPlayer(reg),raw=DATA.history[String(reg)]||[],m=new Map();raw.forEach(x=>{const k=String(x.race_id);const old=m.get(k);if(!old||((x.lane!=null)&&(old.lane==null))||((x.finish!=null)&&(old.finish==null)))m.set(k,x)});const h=[...m.values()];return `<a class="back" href="#/players">← 選手一覧へ</a><div class="racehead"><div class="muted">登録番号 ${esc(reg)}</div><h1>${esc(p.name)}</h1><div class="race-meta"><span class="badge">${esc(p.branch||'—')}</span><span class="badge">${esc(p.grade||'—')}</span><span class="badge">出走 ${h.length}走</span></div></div><section class="section"><h2>レース履歴</h2><div class="tablewrap"><table class="table"><thead><tr><th>日付</th><th>開催</th><th>R</th><th>号艇</th><th>着順</th></tr></thead><tbody>${h.map(x=>`<tr onclick="go('race/${x.race_id}')"><td>${fmtDate(x.date)}</td><td>${esc(x.event_name||'—')}</td><td>${x.race_number==null?'—':x.race_number+'R'}</td><td>${x.lane?x.lane+'号艇':'—'}</td><td>${x.status==='F'?'F':x.finish?x.finish+'着':'—'}</td></tr>`).join('')}</tbody></table></div></section>`}
function render(){let p=location.hash.slice(2)||'';let c=p==='races'?racesPage():p==='players'?playersPage():p.startsWith('race/')?racePage(p.slice(5)):p.startsWith('player/')?playerPage(decodeURIComponent(p.slice(7))):home();document.getElementById('app').innerHTML=c}window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',render);
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0757b8"><title>BR Racing League Official｜公式データポータル</title><style>
:root{
  --bg:#f4f8fc;
  --p:#ffffff;
  --p2:#eaf3fb;
  --l:#d7e4f0;
  --t:#10253f;
  --m:#60748a;
  --a:#0757b8;
  --a2:#0b74dc;
  --g:#d9a92e;
  --deep:#063a7c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--t);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at 90% 5%,rgba(11,116,220,.10),transparent 28%),
    linear-gradient(180deg,#fff 0,#f4f8fc 42%,#eef5fb 100%);
}
body:before{
  content:"";
  position:fixed;
  z-index:-1;
  left:-15%;
  top:330px;
  width:130%;
  height:260px;
  background:linear-gradient(165deg,transparent 0 32%,rgba(7,87,184,.035) 33% 38%,transparent 39% 55%,rgba(11,116,220,.03) 56% 61%,transparent 62%);
  pointer-events:none;
}
button,input{font:inherit}
main{max-width:1100px;margin:auto;padding:30px 16px 70px}
.hero{
  position:relative;
  overflow:hidden;
  padding:28px 24px 30px;
  border-radius:22px;
  background:
    radial-gradient(circle at 88% 15%,rgba(255,255,255,.30),transparent 23%),
    linear-gradient(135deg,#064b9f,#0876d5 58%,#3aa0e8);
  color:#fff;
  box-shadow:0 12px 30px rgba(6,58,124,.15);
}
.hero:after{
  content:"";
  position:absolute;
  right:-70px;
  bottom:-90px;
  width:380px;height:190px;
  border:28px solid rgba(255,255,255,.12);
  border-left-color:transparent;
  border-radius:50%;
  transform:rotate(-13deg);
}
.ey{color:#dceeff;font-size:11px;font-weight:900;letter-spacing:.16em}
.hero h1{font-size:clamp(31px,8vw,54px);line-height:1.05;margin:8px 0}
.hero p{color:#e8f5ff;max-width:720px}
.search{
  display:flex;
  background:#fff;
  border:1px solid #cbdceb;
  padding:5px;
  border-radius:13px;
  margin-top:18px;
  box-shadow:0 6px 18px rgba(7,58,120,.08)
}
.search input{flex:1;background:transparent;border:0;outline:0;color:var(--t);padding:10px}
.search button,.primary{
  background:var(--a);
  color:#fff;
  border:0;
  border-radius:9px;
  padding:10px 14px;
  font-weight:800;
}
.search button:hover,.primary:hover{background:var(--a2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.card{
  background:rgba(255,255,255,.94);
  border:1px solid var(--l);
  border-radius:14px;
  padding:15px;
  box-shadow:0 4px 14px rgba(16,55,90,.045)
}
.label,small{color:var(--m);font-size:12px}
.num{font-size:24px;font-weight:900;margin-top:5px;color:var(--deep)}
.section{margin-top:30px}
.section h2{font-size:20px}
.sectionhead{display:flex;justify-content:space-between;align-items:center}
.link{color:var(--a);font-size:13px}
.player{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0757b8,#2c9be7);color:#fff;display:grid;place-items:center;font-weight:900}
.grade,.badge{font-size:10px;border:1px solid var(--l);border-radius:6px;padding:4px 6px}
.grade{background:#e6f2ff;color:#0757b8}
.badge{color:var(--m);background:#f7fafc}
.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(16,55,90,.04)}
.table{width:100%;border-collapse:collapse;min-width:650px}
.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--l);font-size:13px;text-align:left}
.table th{color:var(--m);background:#f5f9fd}
.table tr:hover{background:#f5faff}
tr{cursor:pointer}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.heroPlayer{
  background:linear-gradient(135deg,#eaf5ff,#fff);
  border:1px solid #cbdff0;
  border-radius:17px;
  padding:20px;
  box-shadow:0 6px 18px rgba(16,55,90,.05)
}
.profile{display:flex;gap:13px;align-items:center}
.big{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#0757b8,#2c9be7);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900}
.profile h1{margin:0;font-size:26px}
.profile p{margin:4px 0;color:var(--m)}
.tabs{display:flex;gap:6px;overflow:auto;margin-top:16px}
.tabs button{white-space:nowrap;background:#fff;color:var(--m);border:1px solid var(--l);border-radius:8px;padding:7px 10px}
.tabs button:hover{border-color:#8ebbe2;color:var(--a)}
.notice{background:#eaf5ff;border:1px solid #b9d8f2;border-radius:11px;padding:12px;color:#285a84;font-size:13px}
.footer{text-align:center;border-top:1px solid var(--l);padding:22px;color:var(--m);font-size:11px;background:rgba(255,255,255,.65)}
@media(max-width:720px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:1fr}
  .kpi{grid-template-columns:repeat(2,1fr)}
  .hero{padding:23px 18px 25px;border-radius:18px}
}
</style>
<style>
.race-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.race-toolbar input,.race-toolbar select{padding:11px 13px;border:1px solid #d9e1ea;border-radius:10px;background:#fff}.race-card{border:1px solid #e1e7ee;border-radius:16px;background:#fff;margin:10px 0;overflow:hidden}.race-card-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;background:#f7f9fc}.race-card a{text-decoration:none}.race-lanes{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:12px}.lane{border:1px solid #e1e7ee;border-radius:10px;padding:10px;text-align:center;background:#fff}.lane-no{font-size:20px;font-weight:800}.lane-name{font-weight:700;margin-top:4px}.lane-finish{font-size:12px;color:#667085;margin-top:5px}.lane-win{background:#fff8e6;border-color:#f0c85a}.race-nav{display:flex;justify-content:space-between;gap:10px;margin:14px 0}.race-nav a,.back-btn{display:inline-block;padding:9px 13px;border:1px solid #d9e1ea;border-radius:9px;background:#fff;text-decoration:none;color:inherit;cursor:pointer}.result-table{width:100%;border-collapse:collapse}.result-table th,.result-table td{padding:10px 9px;border-bottom:1px solid #edf0f4;text-align:left}.result-table th{font-size:12px;color:#667085}.muted{color:#667085}.npc{color:#8a94a6}.flying{font-weight:800}.pending{color:#9a6700}.player-link{color:inherit;text-decoration:none;font-weight:700}.player-link:hover{text-decoration:underline}@media(max-width:700px){.race-lanes{grid-template-columns:repeat(3,1fr)}.race-card-head{align-items:flex-start;flex-direction:column}.result-table{font-size:13px}.result-table th,.result-table td{padding:8px 5px}}
</style>

<style>
.site-header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--l)}
.header-inner{max-width:1180px;margin:auto;min-height:88px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand-logo{width:285px;max-width:68vw;height:auto}.menu-btn{display:none;border:1px solid #c9dced;background:#fff;border-radius:10px;font-size:25px;padding:8px 13px;color:#0757b8}
nav{display:flex;gap:12px;flex-wrap:wrap}nav a{color:#10253f;text-decoration:none;font-weight:800;padding:9px 10px;border-radius:8px}nav a:hover,nav a.active{background:#eaf3fb;color:#0757b8}
#app{max-width:1180px;margin:auto;padding:32px 22px 80px}.hero{background:linear-gradient(135deg,#164e9e,#4b99df);color:#fff;border-radius:0 0 28px 28px;padding:54px 38px;margin:0 -22px 30px}.hero h1{font-size:clamp(34px,7vw,62px);margin:8px 0 14px}.hero p{font-size:19px;line-height:1.6}.eyebrow{letter-spacing:.08em}.section{margin:24px 0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid #d7e4f0;border-radius:16px;padding:20px;box-shadow:0 5px 20px rgba(16,37,63,.04)}.card h2{margin-top:0}.big-number{font-size:34px;display:block}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi .card{text-align:center}.kpi strong{display:block;font-size:30px;margin-top:7px}.player-head{display:flex;gap:20px;align-items:center;background:linear-gradient(135deg,#0757b8,#4b99df);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px}.player-head h1{margin:0;font-size:34px}.player-number{font-size:40px;font-weight:900;background:rgba(255,255,255,.16);border-radius:15px;padding:16px 22px}.grade{background:#fff;color:#0757b8;border-radius:999px;padding:4px 9px;font-weight:900}.search{width:100%;padding:14px;border:1px solid #d5e2ee;border-radius:10px;font-size:16px}.result-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e7eef4}.result-row:last-child{border-bottom:0}.result-row small{display:block;color:#718497;margin-top:4px}.link{cursor:pointer}.back-btn{border:1px solid #c9dced;background:#edf6ff;color:#0757b8;border-radius:10px;padding:10px 14px;font-weight:900}.notice{background:#eef6fd;border:1px solid #d2e5f5;border-radius:14px;padding:16px}.muted{color:#718497}footer{padding:30px 22px;border-top:1px solid var(--l);color:#718497;display:flex;justify-content:space-between;max-width:1180px;margin:auto}
@media(max-width:800px){.header-inner{min-height:72px}.menu-btn{display:block}nav{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;padding:12px 20px;border-bottom:1px solid var(--l);box-shadow:0 10px 20px rgba(0,0,0,.06)}nav.open{display:flex;flex-direction:column}.brand-logo{width:270px}#app{padding:20px 12px 60px}.hero{margin:0 -12px 22px;padding:38px 24px}.cards{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,1fr)}.player-head{padding:20px}.player-head h1{font-size:27px}.player-number{font-size:30px;padding:13px 17px}footer{flex-direction:column;gap:8px}}
</style>

<style>
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat-grid .card{text-align:center}.stat-grid strong{font-size:28px;display:block;margin-top:5px}.filters{display:flex;gap:9px;flex-wrap:wrap}.filters input,.filters select{flex:1;min-width:150px;padding:11px 12px;border:1px solid #d5e2ee;border-radius:10px;background:#fff}.subtle{font-size:12px;color:#718497}.rank-no{width:44px;font-size:22px;font-weight:900;color:#0757b8}.click-row{cursor:pointer}.click-row:hover{background:#f5faff}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef6fd;color:#0757b8;font-size:11px;font-weight:800}.status-ok{color:#147a3d;font-weight:800}.status-pending{color:#9a6700;font-weight:800}.empty{padding:20px;text-align:center;color:#718497}.record-list .result-row{align-items:center}.section-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.section-list .card{cursor:pointer}.section-list .card:hover{border-color:#9bc5e8}@media(max-width:800px){.stat-grid{grid-template-columns:repeat(2,1fr)}.section-list{grid-template-columns:1fr}}
</style>
</head>

function rate(v,d){return d?((v||0)/d*100).toFixed(2):"0.00"}
function updatedText(){const x=DATA&&DATA.source&&DATA.source.generated_at;if(!x)return "データ更新日：不明";const d=new Date(x);if(Number.isNaN(d.getTime()))return `データ更新日：${esc(x)}`;return `データ更新日：${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}
function player(reg){return P.find(p=>String(p.registration_number)===String(reg))}
function playerHistory(reg){return RACES.flatMap(r=>r.entries.filter(e=>String(e.registration_number||"")===String(reg)).map(e=>({race_id:r.id,date:r.date,event_name:r.event_name,grade:r.grade,race_number:r.race_number,lane:e.lane,finish:e.finish,status:e.status,points:e.points,has_result:r.has_result}))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.race_number||0)-(a.race_number||0))}

function raceSummary(r){return `${esc(r.date||"")}　${esc(r.grade||"")}　${esc(r.event_name||"")}　${r.race_number?esc(r.race_number)+"R":""}`}

 const resultCount=RACES.filter(r=>r.has_result).length, totalRuns=Object.values(S).reduce((a,x)=>a+(Number(x.runs)||0),0), latest=RACES.slice().sort(raceSort).slice(0,6);
 return `<section class="hero"><p class="eyebrow">BR RACING LEAGUE OFFICIAL</p><h1>公式データポータル</h1><p>選手・成績・ランキング・レース履歴を一つのデータベースから確認できます。</p><div class="hero-actions"><button class="primary" onclick="nav('players')">選手一覧を見る</button><button class="secondary" onclick="nav('races')">レースを見る</button></div></section>
 <section class="section stat-grid"><div class="card"><small>選手</small><strong>${P.length}</strong><span class="subtle">登録番号管理</span></div><div class="card"><small>収録レース</small><strong>${RACES.length}</strong><span class="subtle">出走表ベース</span></div><div class="card"><small>結果登録済み</small><strong>${resultCount}</strong><span class="subtle">結果あり</span></div><div class="card"><small>集計走数</small><strong>${totalRuns.toLocaleString()}</strong><span class="subtle">選手別集計</span></div></section>
 <section class="section cards"><div class="card"><h2>最新レース</h2>${latest.map(r=>`<div class="result-row click-row" onclick="nav('race/${encodeURIComponent(r.id)}')"><span><b>${raceSummary(r)}</b><small>${r.has_result?'結果登録済み':'結果未登録'}</small></span><b>›</b></div>`).join("")}</div><div class="card"><h2>データベース</h2><p>出走表の号艇は登録時の <b>lane</b> を使用しています。結果側から号艇を推測せず、出走登録データを正本として表示します。</p><p class="subtle">現在はDB検証用データを掲載しています。正式運用時は確定済みデータへ切り替えます。</p></div></section>`;
}
function playersPage(){return `<section class="hero"><p class="eyebrow">PLAYER ENCYCLOPEDIA</p><h1>選手一覧</h1><p>登録番号を基準にした公式選手データ。全${P.length}名</p></section><section class="section"><div class="card"><div class="filters"><input id="playerSearch" placeholder="登録番号・選手名で検索"><select id="playerGrade"><option value="">全級別</option>${[...new Set(P.map(p=>p.grade).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="playerBranch"><option value="">全支部</option>${[...new Set(P.map(p=>p.branch).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div></section><section class="section"><div class="card" id="playerRows"></div></section>`}
function fillPlayers(){const box=document.getElementById('playerRows'),q=document.getElementById('playerSearch'),g=document.getElementById('playerGrade'),b=document.getElementById('playerBranch');if(!box)return;const draw=()=>{const t=(q.value||'').trim().toLowerCase(),a=P.filter(p=>(!t||String(p.registration_number).includes(t)||String(p.name||'').toLowerCase().includes(t))&&(!g.value||p.grade===g.value)&&(!b.value||p.branch===b.value)).sort((x,y)=>Number(x.registration_number)-Number(y.registration_number));box.innerHTML=a.map(p=>`<div class="result-row click-row" onclick="nav('player/${encodeURIComponent(p.registration_number)}')"><span><b>${esc(p.registration_number)}</b>　${esc(p.name)}<small>${esc(p.branch||'—')}　${esc(p.grade||'—')}</small></span><b>›</b></div>`).join('')||'<div class="empty">該当する選手がいません。</div>'};[q,g,b].forEach(x=>x.addEventListener('input',draw));draw()}
function playerPage(reg){const p=player(reg);if(!p)return `<section class="hero"><h1>選手が見つかりません</h1><p>登録番号：${esc(reg)}</p></section>`;const st=stat(reg),hist=playerHistory(reg),rate=st.win_rate==null?'—':Number(st.win_rate).toFixed(2);return `<div style="margin-bottom:12px"><a class="back-btn" href="#/players">← 選手一覧に戻る</a></div><section class="player-head"><div class="player-number">${esc(String(reg).slice(-2))}</div><div><h1>${esc(p.name)}</h1><p>登録番号 ${esc(reg)}　<span class="grade">${esc(p.grade||'—')}</span></p><p>${esc(p.branch||'—')}</p></div></section><section class="section stat-grid"><div class="card"><small>通算得点率</small><strong>${rate}</strong></div><div class="card"><small>総走数</small><strong>${st.runs||0}</strong></div><div class="card"><small>合計得点</small><strong>${st.points||0}</strong></div><div class="card"><small>1着数</small><strong>${st.wins||0}</strong></div></section><section class="section cards"><div class="card"><h2>基本プロフィール</h2><p>登録番号：${esc(reg)}</p><p>級別：${esc(p.grade||'—')}</p><p>支部：${esc(p.branch||'—')}</p><p>派閥：${esc(p.faction||'—')}</p></div><div class="card"><h2>着順別成績</h2><p>1着 ${st.wins||0}　2着 ${st.second||0}　3着 ${st.third||0}</p><p>4着 ${st.fourth||0}　5着 ${st.fifth||0}　6着 ${st.sixth||0}</p><p>2連率：${rate((st.wins||0)+(st.second||0),st.runs)}%　3連率：${rate((st.wins||0)+(st.second||0)+(st.third||0),st.runs)}%</p><p>合計得点：${st.points||0}点</p></div></section><section class="section"><div class="card"><div class="sectionhead"><h2>出走履歴</h2><span class="tag">${hist.length}件</span></div>${hist.length?hist.map(r=>`<div class="result-row click-row" onclick="nav('race/${encodeURIComponent(r.race_id)}')"><span><b>${esc(r.date)}</b>　${esc(r.event_name||'')} ${r.race_number?esc(r.race_number)+'R':''}<small>号艇 ${esc(r.lane)}　${r.status?esc(r.status):(r.finish?esc(r.finish)+'着':'結果未登録')}</small></span><b>${r.points!=null?esc(r.points)+'点':'—'} ›</b></div>`).join(''):'<div class="empty">出走履歴がありません。</div>'}</div></section>`}
function rankingsPage(){return `<section class="hero"><p class="eyebrow">RANKINGS</p><h1>ランキング</h1><p>正式DBの成績データから各指標を集計しています。</p></section><section class="section"><div class="card"><div class="filters"><select id="rankType"><option value="win_rate">得点率</option><option value="wins">1着数</option><option value="points">総得点</option><option value="runs">走数</option><option value="second_rate">2連率</option><option value="third_rate">3連率</option></select><input id="rankSearch" placeholder="選手名・登録番号で検索"></div><p class="subtle" id="rankNote">得点率の高い順</p><div id="rankRows"></div></div></section>`}
function fillRankings(){const box=document.getElementById('rankRows'),q=document.getElementById('rankSearch'),type=document.getElementById('rankType'),note=document.getElementById('rankNote');if(!box)return;const labels={win_rate:'得点率',wins:'1着数',points:'総得点',runs:'走数',second_rate:'2連率',third_rate:'3連率'};const draw=()=>{const t=(q.value||'').toLowerCase(),key=type.value;let a=P.map(p=>{const st=stat(p.registration_number),v=key==='win_rate'?(st.win_rate??-1):key==='wins'?(st.wins||0):key==='points'?(st.points||0):key==='runs'?(st.runs||0):key==='second_rate'?Number(rate((st.wins||0)+(st.second||0),st.runs)):Number(rate((st.wins||0)+(st.second||0)+(st.third||0),st.runs));return {p,st,v}}).filter(x=>!t||String(x.p.registration_number).includes(t)||String(x.p.name||'').toLowerCase().includes(t)).filter(x=>x.st.runs>0);a.sort((x,y)=>y.v-x.v||y.st.points-x.st.points||x.p.registration_number.localeCompare(y.p.registration_number));note.textContent=`${labels[key]}の高い順`;box.innerHTML=a.map((x,i)=>{const display=key==='win_rate'?Number(x.st.win_rate).toFixed(2):key.endsWith('_rate')?`${x.v.toFixed(2)}%`:x.v.toLocaleString();return `<div class="result-row click-row" onclick="nav('player/${encodeURIComponent(x.p.registration_number)}')"><span><b class="rank-no">${i+1}</b> ${esc(x.p.registration_number)}　${esc(x.p.name)}<small>${esc(x.p.branch||'—')}　${x.st.runs}走　${x.st.points}点</small></span><b>${display}${key==='win_rate'?'':''}</b></div>`}).join('')||'<div class="empty">該当する選手がいません。</div>'};[q,type].forEach(x=>x.addEventListener('input',draw));draw()}
function racesPage(){return `<section class="hero"><p class="eyebrow">RACE DATABASE</p><h1>レース一覧</h1><p>出走表登録の号艇を正本として、結果と選手ページを相互に確認できます。</p></section><section class="section"><div class="card"><div class="filters"><input id="raceSearch" placeholder="開催名・日付・選手名・登録番号で検索"><select id="raceGrade"><option value="">全グレード</option>${[...new Set(RACES.map(r=>r.grade).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="raceStatus"><option value="">結果状態</option><option value="done">結果登録済み</option><option value="pending">結果未登録</option></select></div></div></section><section class="section" id="raceRows"></section>`}
function fillRaces(){const box=document.getElementById('raceRows'),q=document.getElementById('raceSearch'),g=document.getElementById('raceGrade'),st=document.getElementById('raceStatus');if(!box)return;const draw=()=>{const t=(q.value||'').toLowerCase(),a=RACES.filter(r=>(!g.value||r.grade===g.value)&&(!st.value||(st.value==='done'?r.has_result:!r.has_result))&&(!t||`${r.date} ${r.event_name} ${r.grade} ${r.race_number} ${r.entries.map(e=>e.name+' '+(e.registration_number||'')).join(' ')}`.toLowerCase().includes(t))).sort(raceSort);box.innerHTML=a.map(r=>`<div class="race-card"><div class="race-card-head"><a href="#/race/${encodeURIComponent(r.id)}"><b>${raceSummary(r)}</b></a><span class="${r.has_result?'status-ok':'status-pending'}">${r.has_result?'結果登録済み':'結果未登録'}</span></div><div class="race-lanes">${r.entries.map(e=>`<div class="lane ${e.finish===1?'lane-win':''}"><div class="lane-no">${esc(e.lane)}</div><div class="lane-name">${e.registration_number?`<a class="player-link" href="#/player/${encodeURIComponent(e.registration_number)}">${esc(e.name)}</a>`:esc(e.name)}</div><div class="lane-finish">${e.status?esc(e.status):(e.finish?esc(e.finish)+'着':'—')}</div></div>`).join('')}</div></div>`).join('')||'<div class="card empty">該当するレースがありません。</div>'};[q,g,st].forEach(x=>x.addEventListener('input',draw));draw()}
function racePage(id){const r=RACES.find(x=>String(x.id)===String(id));if(!r)return `<section class="hero"><h1>レースが見つかりません</h1></section>`;const idx=RACES.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||(a.section_id-b.section_id)||(a.race_number-b.race_number)).findIndex(x=>String(x.id)===String(id));const sortedR=RACES.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||(a.section_id-b.section_id)||(a.race_number-b.race_number)),prev=sortedR[idx-1],next=sortedR[idx+1],rows=r.entries.slice().sort((a,b)=>(a.finish??99)-(b.finish??99)||(a.lane-b.lane));return `<div style="margin-bottom:12px"><a class="back-btn" href="#/races">← レース一覧に戻る</a></div><section class="hero"><p class="eyebrow">RACE CARD</p><h1>${esc(r.race_number)}R</h1><p>${raceSummary(r)}</p></section><section class="section"><div class="race-nav">${prev?`<a href="#/race/${encodeURIComponent(prev.id)}">← 前のレース</a>`:'<span></span>'}${next?`<a href="#/race/${encodeURIComponent(next.id)}">次のレース →</a>`:'<span></span>'}</div><div class="card"><h2>出走表・結果</h2><p class="muted">号艇は出走表登録時の lane を使用しています。</p><div class="race-lanes">${r.entries.map(e=>`<div class="lane ${e.finish===1?'lane-win':''}"><div class="lane-no">${esc(e.lane)}</div><div class="lane-name">${e.registration_number?`<a class="player-link" href="#/player/${encodeURIComponent(e.registration_number)}">${esc(e.name)}</a>`:esc(e.name)}${!e.registration_number?'<small class="npc">（登録番号なし/NPC等）</small>':''}</div><div class="lane-finish">${e.status?`<span class="flying">${esc(e.status)}</span>`:(e.finish?esc(e.finish)+'着':'<span class="pending">結果未登録</span>')}</div></div>`).join('')}</div></div></section><section class="section"><div class="card"><h2>着順</h2>${r.has_result?`<table class="result-table"><thead><tr><th>着</th><th>号艇</th><th>登録番号</th><th>選手</th><th>得点</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${e.finish?esc(e.finish)+'着':esc(e.status||'—')}</td><td>${esc(e.lane)}</td><td>${esc(e.registration_number||'—')}</td><td>${e.registration_number?`<a class="player-link" href="#/player/${encodeURIComponent(e.registration_number)}">${esc(e.name)}</a>`:esc(e.name)}</td><td>${e.points!=null?esc(e.points):'—'}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">結果報告がまだ登録されていません。出走表のみ表示しています。</p>'}</div></section>`}
function seasonsPage(){const groups={};RACES.forEach(r=>{const key=r.date||'日付不明';(groups[key]??=[]).push(r)});const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));return `<section class="hero"><p class="eyebrow">SEASONS</p><h1>シーズン・開催履歴</h1><p>現在のWebデータに収録されている開催日を確認できます。</p></section><section class="section"><div class="notice">シーズン境界は実際のSG開催日を基準に管理する仕様です。現在のWebデータにはシーズンIDが未収録のため、ここでは開催日単位で表示しています。</div></section><section class="section section-list">${dates.map(d=>`<div class="card"><h2>${esc(d)}</h2><p>${groups[d].length}レース　${[...new Set(groups[d].map(r=>r.grade).filter(Boolean))].join(' / ')||'グレード未設定'}</p><button class="back-btn" onclick="nav('races')">レース一覧を見る</button></div>`).join('')}</section>`}
function recordsPage(){const arr=P.map(p=>({p,st:stat(p.registration_number)}));const mostRuns=arr.slice().sort((a,b)=>b.st.runs-a.st.runs).slice(0,10),mostWins=arr.slice().sort((a,b)=>b.st.wins-a.st.wins).slice(0,10),bestRate=arr.filter(x=>x.st.runs>0).slice().sort((a,b)=>b.st.win_rate-a.st.win_rate).slice(0,10);return `<section class="hero"><p class="eyebrow">RECORDS</p><h1>記録</h1><p>現在の正式DBから確認できる各種記録です。</p></section><section class="section cards"><div class="card record-list"><h2>最多走数</h2>${mostRuns.map((x,i)=>`<div class="result-row click-row" onclick="nav('player/${encodeURIComponent(x.p.registration_number)}')"><span>${i+1}. ${esc(x.p.name)}<small>${x.p.registration_number}</small></span><b>${x.st.runs}走</b></div>`).join('')}</div><div class="card record-list"><h2>最多1着</h2>${mostWins.map((x,i)=>`<div class="result-row click-row" onclick="nav('player/${encodeURIComponent(x.p.registration_number)}')"><span>${i+1}. ${esc(x.p.name)}<small>${x.p.registration_number}</small></span><b>${x.st.wins}勝</b></div>`).join('')}</div><div class="card record-list"><h2>最高得点率</h2>${bestRate.map((x,i)=>`<div class="result-row click-row" onclick="nav('player/${encodeURIComponent(x.p.registration_number)}')"><span>${i+1}. ${esc(x.p.name)}<small>${x.st.runs}走</small></span><b>${Number(x.st.win_rate).toFixed(2)}</b></div>`).join('')}</div></section>`}
function branchesPage(){const m={};P.forEach(p=>{const k=p.branch||'未登録';(m[k]??={players:0,runs:0,points:0});m[k].players++;const st=stat(p.registration_number);m[k].runs+=st.runs||0;m[k].points+=st.points||0});return `<section class="hero"><p class="eyebrow">BRANCHES</p><h1>支部</h1><p>登録選手を支部別に集計しています。</p></section><section class="section"><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>支部</th><th>選手数</th><th>走数</th><th>得点</th></tr></thead><tbody>${Object.entries(m).sort((a,b)=>b[1].players-a[1].players).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.players}</td><td>${v.runs}</td><td>${v.points}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function factionsPage(){const count=P.filter(p=>p.faction).length;return `<section class="hero"><p class="eyebrow">FACTIONS</p><h1>派閥</h1><p>選手データに登録されている派閥情報を表示します。</p></section><section class="section"><div class="notice">現在のWebデータでは派閥情報が登録されている選手は ${count}名です。派閥DBが整備された段階でここを正式な派閥一覧へ拡張します。</div></section>`}
async function render(){try{if(!DATA)await loadWebData();const path=(location.hash||'#/').slice(2);let content=path===''||path==='home'?home():path==='players'?playersPage():path==='rankings'?rankingsPage():path==='races'?racesPage():path==='seasons'?seasonsPage():path==='records'?recordsPage():path==='branches'?branchesPage():path==='factions'?factionsPage():path.startsWith('player/')?playerPage(decodeURIComponent(path.slice(7))):path.startsWith('race/')?racePage(decodeURIComponent(path.slice(5))):home();document.getElementById('app').innerHTML=content;const ud=document.getElementById('dataUpdated');if(ud)ud.textContent=updatedText();if(path==='players')fillPlayers();if(path==='rankings')fillRankings();if(path==='races')fillRaces();document.querySelectorAll('#mainNav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#/'+path));window.scrollTo(0,0);document.getElementById('mainNav').classList.remove('open')}catch(e){document.getElementById('app').innerHTML=`<section class="hero"><h1>データ読み込みエラー</h1><p>${esc(e.message)}</p></section>`}}
window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',render);
</script>

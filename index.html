<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>BR Racing League｜選手名鑑</title>
<style>
:root{--bg:#07111f;--p:#0d1b2e;--p2:#11243b;--l:#213750;--t:#f5f8fc;--m:#9fb0c4;--a:#39a7ff;--g:#f5c451}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
button,input{font:inherit}.top{position:sticky;top:0;background:#07111ff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--l);z-index:5}
.nav{max-width:1100px;margin:auto;padding:13px 16px}.brand{font-weight:900}.brand small{display:block;color:var(--a);font-size:10px;letter-spacing:.16em}
.menu{display:flex;gap:5px;overflow:auto;margin-top:10px}.menu button{white-space:nowrap;background:transparent;color:var(--m);border:0;padding:8px 10px;border-radius:8px}.menu button.active{background:var(--p2);color:#fff}
main{max-width:1100px;margin:auto;padding:25px 16px 70px}.hero{padding:12px 0 22px}.ey{color:var(--a);font-size:11px;font-weight:800;letter-spacing:.16em}.hero h1{font-size:clamp(31px,8vw,54px);line-height:1.05;margin:8px 0}.hero p{color:var(--m);max-width:720px}
.search{display:flex;background:var(--p);border:1px solid var(--l);padding:5px;border-radius:13px;margin-top:18px}.search input{flex:1;background:transparent;border:0;outline:0;color:white;padding:10px}.search button,.primary{background:var(--a);border:0;border-radius:9px;padding:10px 14px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:15px}.label,small{color:var(--m);font-size:12px}.num{font-size:24px;font-weight:900;margin-top:5px}.section{margin-top:28px}.section h2{font-size:20px}.sectionhead{display:flex;justify-content:space-between}.link{color:var(--a);font-size:13px}.player{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:10px;background:#17517d;display:grid;place-items:center;font-weight:900}.grade,.badge{font-size:10px;border:1px solid var(--l);border-radius:6px;padding:4px 6px}.grade{background:#193653;color:#bfe2ff}.badge{color:var(--m)}
.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--l);font-size:13px;text-align:left}.table th{color:var(--m)}tr{cursor:pointer}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.heroPlayer{background:linear-gradient(135deg,#0e2036,#0b1728);border:1px solid var(--l);border-radius:17px;padding:20px}.profile{display:flex;gap:13px;align-items:center}.big{width:60px;height:60px;border-radius:16px;background:#237db9;display:grid;place-items:center;font-size:22px;font-weight:900}.profile h1{margin:0;font-size:26px}.profile p{margin:4px 0;color:var(--m)}.tabs{display:flex;gap:6px;overflow:auto;margin-top:16px}.tabs button{white-space:nowrap;background:var(--p);color:var(--m);border:1px solid var(--l);border-radius:8px;padding:7px 10px}.notice{background:#0c2137;border:1px solid #214667;border-radius:11px;padding:12px;color:#b9d9f5;font-size:13px}.footer{text-align:center;border-top:1px solid var(--l);padding:22px;color:var(--m);font-size:11px}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="top"><nav class="nav"><div class="brand"><small>BR RACING LEAGUE</small>選手名鑑</div>
<div class="menu" id="menu"><button data-p="home" class="active">ホーム</button><button data-p="players">選手</button><button data-p="rankings">ランキング</button><button data-p="races">レース</button><button data-p="seasons">シーズン</button><button data-p="records">歴代記録</button><button data-p="groups">支部・派閥</button></div></nav></header>
<main id="app"></main><footer class="footer">BR Racing League 公式データポータル｜プレビュー版</footer>
<script>
const ps=[
["4586","おるふぇ","A1","北九州支部","ポンコツ会","7.82","286","42","¥1,284,000"],
["4445","サンプル選手A","A1","福岡支部","○○塾","7.61","274","36","¥1,102,000"],
["3934","サンプル選手B","A2","山口支部","無所属","6.94","248","28","¥842,000"],
["2040","サンプル選手C","B1","熊本支部","ポンコツ会","6.21","198","19","¥615,000"],
["4168","サンプル選手D","B2","大分支部","無所属","5.54","142","11","¥381,000"]];
const $=s=>document.querySelector(s);
function nav(p){location.hash=p;render(p)}
function openPlayer(id){location.hash="player-"+id;render("player",id)}
function pc(p){return `<div class="card" onclick="openPlayer('${p[0]}')"><div class="player"><div class="avatar">${p[0].slice(-2)}</div><div><b>${p[1]}</b><br><span class="grade">${p[2]}</span> <span class="badge">${p[3]}</span></div></div><p class="label">派閥：${p[4]}</p><b>勝率 ${p[5]}</b></div>`}
function home(){return `<section class="hero"><div class="ey">OFFICIAL DATA PORTAL</div><h1>BR Racing League<br>選手名鑑</h1><p>選手・大会・シーズン・支部・派閥・歴代記録をひとつに。将来は公式DBと連携して自動更新します。</p><div class="search"><input id="q" placeholder="選手名・登録番号"><button onclick="search()">検索</button></div></section>
<div class="grid"><div class="card"><div class="label">登録選手</div><div class="num">—</div></div><div class="card"><div class="label">現行シーズン</div><div class="num">第6</div></div><div class="card"><div class="label">グレード</div><div class="num">SG〜一般</div></div><div class="card"><div class="label">DB</div><div class="num">準備中</div></div></div>
<div class="section"><div class="sectionhead"><h2>注目選手</h2><a class="link" onclick="nav('players')">すべて見る →</a></div><div class="cards">${ps.slice(0,3).map(pc).join("")}</div></div>
<div class="section"><h2>BR Racing League独自機能</h2><div class="cards"><div class="card"><b>🏆 SG・G1選出歴</b><p class="label">選出・出場・優勝履歴を集約。</p></div><div class="card"><b>👥 派閥</b><p class="label">支部とは別に独自グループを管理。</p></div><div class="card"><b>📜 歴代記録</b><p class="label">大会の歴史と記録を蓄積。</p></div></div></div>`}
function rows(a){return a.map(p=>`<tr onclick="openPlayer('${p[0]}')"><td><div class="player"><div class="avatar">${p[0].slice(-2)}</div><b>${p[1]}</b> <span class="badge">${p[0]}</span></div></td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td><td>${p[5]}</td><td>${p[6]}</td><td>${p[7]}</td><td>${p[8]}</td></tr>`).join("")}
function players(){return `<section class="hero"><div class="ey">PLAYERS</div><h1>選手一覧</h1><p>登録番号・級別・支部・派閥から検索できます。</p><div class="search"><input id="pq" placeholder="選手名・登録番号"><button onclick="filterP()">検索</button></div></section><div class="tablewrap"><table class="table"><thead><tr><th>選手</th><th>級別</th><th>支部</th><th>派閥</th><th>勝率</th><th>走数</th><th>優勝</th><th>賞金</th></tr></thead><tbody id="rows">${rows(ps)}</tbody></table></div>`}
function filterP(){let q=$("#pq").value;$("#rows").innerHTML=rows(ps.filter(p=>p[0].includes(q)||p[1].includes(q)||p[3].includes(q)||p[4].includes(q)))}
function search(){let q=$("#q").value,p=ps.find(x=>x[0]===q||x[1].includes(q));p?openPlayer(p[0]):nav("players")}
function rankings(){let a=[...ps].sort((x,y)=>y[5]-x[5]);return `<section class="hero"><div class="ey">RANKINGS</div><h1>ランキング</h1><p>DB接続後に本番データへ切り替わります。</p></section><div class="card"><h3>勝率ランキング</h3><table class="table">${a.map((p,i)=>`<tr onclick="openPlayer('${p[0]}')"><td>${i+1}</td><td>${p[1]}</td><td><b>${p[5]}</b></td></tr>`).join("")}</table></div>`}
function races(){return `<section class="hero"><div class="ey">RACES</div><h1>レース・大会</h1><p>SG / G1 / G2 / G3 / 一般戦を大会単位で閲覧。</p></section><div class="cards"><div class="card"><h3>G1 ○○記念</h3><p class="label">10/4〜10/6　優勝：おるふぇ</p><span class="grade">G1</span></div><div class="card"><h3>G2 ○○カップ</h3><p class="label">10/3〜10/5　集計準備中</p><span class="grade">G2</span></div><div class="card"><h3>一般戦 ○○シリーズ</h3><p class="label">10/5〜10/6　集計準備中</p><span class="grade">一般</span></div></div><div class="section notice">DB接続後は出走表・予選・準優・優勝戦・全レース結果まで自動表示します。</div>`}
function seasons(){return `<section class="hero"><div class="ey">SEASONS</div><h1>シーズン</h1><p>SG開催を基準としたシーズン別データ。</p></section><div class="cards">${[1,2,3,4,5,6].map(n=>`<div class="card"><h3>第${n}シーズン</h3><p class="label">ランキング・大会履歴・選手成績</p><button class="primary">詳細を見る</button></div>`).join("")}</div>`}
function records(){return `<section class="hero"><div class="ey">ALL-TIME RECORDS</div><h1>歴代記録</h1><p>BR Racing Leagueの歴史が蓄積されるページ。</p></section><div class="grid">${["歴代最高勝率","最多優勝","最多賞金","最多SG優勝"].map(x=>`<div class="card"><div class="label">${x}</div><div class="num">—</div><p class="label">DB蓄積後に確定</p></div>`).join("")}</div>`}
function groups(){let bs=[...new Set(ps.map(p=>p[3]))],gs=[...new Set(ps.map(p=>p[4]))];return `<section class="hero"><div class="ey">BRANCHES & GROUPS</div><h1>支部・派閥</h1><p>公式所属の支部と、独自グループの派閥を完全に分離して管理。</p></section><h2>支部</h2><div class="cards">${bs.map(x=>`<div class="card"><h3>🏢 ${x}</h3><p>${ps.filter(p=>p[3]===x).length}名</p></div>`).join("")}</div><div class="section"><h2>派閥</h2><div class="cards">${gs.map(x=>`<div class="card"><h3>👥 ${x}</h3><p>${ps.filter(p=>p[4]===x).length}名</p></div>`).join("")}</div>`}
function playerPage(id){let p=ps.find(x=>x[0]===id)||ps[0];return `<div class="heroPlayer"><div class="profile"><div class="big">${p[0].slice(-2)}</div><div><h1>${p[1]}</h1><p>登録番号 ${p[0]}　<span class="grade">${p[2]}</span></p><p>${p[3]}　｜　派閥：${p[4]}</p></div></div><div class="tabs"><button>プロフィール</button><button>通算成績</button><button>シーズン</button><button>優勝歴</button><button>SG/G1選出歴</button><button>レース履歴</button></div></div><div class="kpi"><div class="card"><small>通算勝率</small><strong>${p[5]}</strong></div><div class="card"><small>総走数</small><strong>${p[6]}</strong></div><div class="card"><small>優勝回数</small><strong>${p[7]}</strong></div><div class="card"><small>通算賞金</small><strong>${p[8]}</strong></div></div><div class="section cards"><div class="card"><h3>基本プロフィール</h3><p>登録番号：${p[0]}</p><p>級別：${p[2]}</p><p>支部：${p[3]}</p><p>派閥：${p[4]}</p></div><div class="card"><h3>SG・G1選出歴</h3><p class="label">DB蓄積後に自動表示</p></div><div class="card"><h3>シーズン成績</h3><p class="label">第6シーズン：集計準備中</p></div></div><div class="section notice">レース結果DB接続後、節・レース・着順などを自動表示します。</div>`}
function render(p,id){document.querySelectorAll(".menu button").forEach(b=>b.classList.toggle("active",b.dataset.p===p));$("#app").innerHTML=p==="home"?home():p==="players"?players():p==="rankings"?rankings():p==="races"?races():p==="seasons"?seasons():p==="records"?records():p==="groups"?groups():playerPage(id)}
$("#menu").onclick=e=>{let b=e.target.closest("button");if(b)nav(b.dataset.p)}
let h=location.hash.slice(1);h.startsWith("player-")?render("player",h.slice(7)):render(h||"home");
</script></body></html>
